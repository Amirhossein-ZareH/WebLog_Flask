{% extends "base.html" %}

{% block title %}نوشته جدید - وبلاگ مدرن{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .form-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .form-header h2 {
        font-size: 2rem;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    
    .editor-toolbar {
        background: var(--gray-100);
        border-radius: 12px 12px 0 0;
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        border: 2px solid var(--gray-200);
        border-bottom: none;
    }
    
    .toolbar-btn {
        background: white;
        border: none;
        width: 35px;
        height: 35px;
        border-radius: 8px;
        cursor: pointer;
        transition: all var(--transition);
        color: var(--gray-600);
    }
    
    .toolbar-btn:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
    }
    
    .form-control {
        border-radius: 0 0 12px 12px;
    }
    
    .character-count {
        text-align: left;
        font-size: 0.85rem;
        color: var(--gray-400);
        margin-top: 0.5rem;
    }
    
    .preview-section {
        margin-top: 2rem;
        padding: 1.5rem;
        background: var(--gray-50);
        border-radius: 16px;
        display: none;
    }
    
    .preview-section.active {
        display: block;
        animation: fadeInUp 0.5s ease;
    }
    
    .preview-content {
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        margin-top: 1rem;
        line-height: 1.8;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h2><i class="fas fa-pen-fancy"></i> نوشته جدید</h2>
        <p>ایده‌ها و thoughts خود را با دیگران به اشتراک بگذارید</p>
    </div>
    
    <div class="card">
        <form method="POST" id="postForm">
            <div class="form-group">
                <label for="title">عنوان پست</label>
                <input type="text" id="title" name="title" class="form-control" 
                       placeholder="عنوان جذاب برای پست خود انتخاب کنید..." required>
            </div>
            
            <div class="form-group">
                <label for="content">محتوا</label>
                <div class="editor-toolbar">
                    <button type="button" class="toolbar-btn" onclick="formatText('bold')">
                        <i class="fas fa-bold"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="formatText('italic')">
                        <i class="fas fa-italic"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="formatText('heading')">
                        <i class="fas fa-heading"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="formatText('link')">
                        <i class="fas fa-link"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="formatText('code')">
                        <i class="fas fa-code"></i>
                    </button>
                    <button type="button" class="toolbar-btn" onclick="showPreview()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <textarea id="content" name="content" class="form-control" 
                          rows="12" placeholder="محتوای پست خود را بنویسید..." required></textarea>
                <div class="character-count">
                    <span id="charCount">0</span> کاراکتر
                </div>
            </div>
            
            <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> انتشار پست
                </button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> انصراف
                </a>
            </div>
        </form>
    </div>
    
    <div class="preview-section" id="previewSection">
        <h3><i class="fas fa-eye"></i> پیش‌نمایش</h3>
        <div class="preview-content" id="previewContent"></div>
    </div>
</div>

<script>
    // شمارش کاراکترها
    const content = document.getElementById('content');
    const charCount = document.getElementById('charCount');
    
    content.addEventListener('input', function() {
        charCount.textContent = this.value.length;
    });
    
    // فرمت‌دهی متن
    function formatText(type) {
        const textarea = document.getElementById('content');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const selected = textarea.value.substring(start, end);
        
        let formatted = '';
        switch(type) {
            case 'bold':
                formatted = `**${selected}**`;
                break;
            case 'italic':
                formatted = `*${selected}*`;
                break;
            case 'heading':
                formatted = `\n## ${selected}\n`;
                break;
            case 'link':
                const url = prompt('لینک را وارد کنید:', 'https://');
                if(url) formatted = `[${selected}](${url})`;
                break;
            case 'code':
                formatted = `\`${selected}\``;
                break;
        }
        
        if(formatted) {
            textarea.value = textarea.value.substring(0, start) + formatted + textarea.value.substring(end);
            charCount.textContent = textarea.value.length;
        }
    }
    
    // پیش‌نمایش
    function showPreview() {
        const content = document.getElementById('content').value;
        const preview = document.getElementById('previewContent');
        const section = document.getElementById('previewSection');
        
        let html = content
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/## (.*?)\n/g, '<h3>$1</h3>')
            .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
            .replace(/`(.*?)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
        
        preview.innerHTML = html;
        section.classList.add('active');
        section.scrollIntoView({ behavior: 'smooth' });
    }
    
    // انیمیشن
    gsap.from(".card", {
        duration: 0.8,
        y: 30,
        opacity: 0,
        ease: "back.out(1.2)"
    });
</script>
{% endblock %}
